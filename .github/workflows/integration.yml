name: Integration Tests

on: [ pull_request ]

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: engine_test
          MYSQL_USER: engine
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      mysql_secondary:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: engine_test_port
          MYSQL_USER: engine
          MYSQL_PASSWORD: secret
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up php 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer self-update && composer install && composer dump-autoload

      - name: Start MySQL socket container
        run: |
          mkdir -p /tmp/mysql_socket
          docker run -d \
            --name mysql_socket \
            -e MYSQL_ROOT_PASSWORD=secret \
            -e MYSQL_DATABASE=engine_test_socket \
            -e MYSQL_USER=engine \
            -e MYSQL_PASSWORD=secret \
            -v /tmp/mysql_socket:/var/run/mysqld \
            mysql:8.4
          for i in $(seq 1 30); do
            [ -S /tmp/mysql_socket/mysqld.sock ] && break
            sleep 2
          done

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite Integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: secret
          DB_PORT_SECONDARY: 3307
          DB_DATABASE_SECONDARY: engine_test_port
          DB_SOCKET: /tmp/mysql_socket/mysqld.sock
          DB_DATABASE_SOCKET: engine_test_socket
